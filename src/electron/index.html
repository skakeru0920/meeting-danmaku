<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>T-004: Electron 透過オーバーレイの検証</title>
    <style>
      /*
       * 検証用の最小構成。src/overlay/style.css は読み込まない。
       * 映らなかったときの切り分けのため、ここは独立させておく(Plan 002)。
       */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      /*
       * 右から左へ流れるテキスト 1 つ。CSS animation で十分。
       * 縁取りは明るい画面の上でも読めるようにするため。
       */
      .marker {
        position: absolute;
        top: 40%;
        left: 100%;
        white-space: nowrap;
        font-family: system-ui, sans-serif;
        font-size: 48px;
        font-weight: bold;
        color: #fff;
        text-shadow:
          -2px -2px 0 #000,
          2px -2px 0 #000,
          -2px 2px 0 #000,
          2px 2px 0 #000;
        animation: flow 8s linear infinite;
      }

      @keyframes flow {
        from {
          transform: translateX(0);
        }
        to {
          /* 画面幅 + 文字列の幅ぶん。実測せず vw で大きめに取る */
          transform: translateX(-140vw);
        }
      }

      /*
       * 透過とクリック透過の確認用。
       *
       * 半透明の枠を四隅に出しておくと、ウィンドウがどこまで覆っているかと、
       * 枠の内側の背景が透けているかが同時に分かる。
       */
      .frame {
        position: absolute;
        inset: 20px;
        border: 4px solid rgba(255, 0, 0, 0.6);
        border-radius: 8px;
      }

      .label {
        position: absolute;
        top: 32px;
        left: 32px;
        font-family: ui-monospace, monospace;
        font-size: 14px;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        padding: 8px 12px;
        border-radius: 4px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>

    <div class="label">
      T-004 検証中<br />
      赤枠の内側が透けていれば透過 OK<br />
      枠の内側をクリックして背後のアプリが反応すればクリック透過 OK
    </div>

    <div class="marker">■ ここに弾幕が流れる ■</div>
  </body>
</html>
