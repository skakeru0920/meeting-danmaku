<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Zoom チャット → overlay</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem;
      }
      #status {
        padding: 0.5rem 0.75rem;
        border-radius: 4px;
        background: #eee;
        margin-bottom: 1rem;
      }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 13px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .entry {
        border-bottom: 1px solid #ddd;
        padding: 0.5rem 0;
      }
      .note {
        color: #555;
        font-size: 0.875rem;
      }
      .entry[data-kind='skipped'] {
        color: #999;
      }
      .entry[data-kind='error'] {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div id="status">読み込み中…</div>

    <p class="note">
      このタブを開いている間だけコメントが流れる。閉じると止まる。
      <a href="/src/overlay/" target="_blank" rel="noreferrer">overlay を開く</a>
    </p>

    <!-- Meeting SDK がここへ描画する。join するまでは表示されない -->
    <div id="meetingSDKElement"></div>

    <div id="log"></div>

    <!-- Vite の root がプロジェクト直下なので相対パスで参照する -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
